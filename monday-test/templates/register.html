<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register | Monday Test Planner</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="ff">
    <div id="sr">
      <h1>Monday Test Planner</h1>
      <h2>🧑‍🎓 Student Registration</h2>
    </div>

    <form id="registerForm">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="Full name" required><br>

      <label for="regUsername">Username</label>
      <input type="text" id="regUsername" placeholder="Username" required><br>

      <label for="regPassword">Password</label>
      <input type="password" id="regPassword" placeholder="Password" required><br>

      <label for="regConfirmPassword">Confirm Password</label>
      <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required><br>

      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" placeholder="Email" required><br>

      <label for="regNumber">Phone Number</label>
      <input type="tel" id="regNumber" placeholder="Mobile number" required>

      <input type="checkbox" id="terms" name="terms">
      <label for="terms">Agree to terms and conditions</label><br><br>
      
      <button class="button" type="submit" style="margin-left: 150px;">Register</button>
    </form>
  </div>

  <p id="registerMessage"></p>

  <p style="text-align:center;">Already have an account? <a href="/login">Login here</a></p>

  <script src="/static/register.js"></script>
</body>
</html>
