<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="/static/style1.css">
</head>
<body>
  <header class="dashboard-header">
    <h2>🎓 Welcome back, <span id="studentName"></span></h2>
    <button onclick="logout()" class="logout-btn">Logout</button>
  </header>

  <div class="dashboard-container">
    <section class="quick-stats">
      <h3>Your Study Overview</h3>
      <div class="stats-grid">
        <div class="stat-card">
          <span id="upcomingTestsCount">0</span>
          <p>Upcoming Tests</p>
        </div>
        <div class="stat-card">
          <span id="completedTopics">0</span>
          <p>Topics Completed</p>
        </div>
      </div>
    </section>

    <div class="action-buttons">
      <a href="/" class="primary-btn">Go to Test Planner</a>
      <button class="secondary-btn" onclick="showStudyTips()">Study Tips</button>
    </div>
  </div>

  <section class="exam-section">
  <h2>📘 Upcoming Exams</h2>
  <div id="examList">
    <p>No exams scheduled.</p>
  </div>
</section>


  <!-- <section class="calendar-section">
    <h2>📅 Test Calendar</h2>
    <div id="calendarView"></div>
  </section> -->

  <section class="notes-section">
    <h2><i class="fas fa-sticky-note"></i> Smart Notes with Reminders</h2>
    <textarea id="notesArea" rows="6" placeholder="Write your notes here..."></textarea>
    <div class="notes-actions">
      <button onclick="saveNotes()"><i class="fas fa-save"></i> Save Notes</button>
      <div class="reminder-controls">
        <select id="reminderType">
          <option value="one-time">One-time reminder</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
        </select>
        <input type="datetime-local" id="noteReminderTime">
        <input type="email" id="reminderEmail" placeholder="Email (optional)">
        <button onclick="setNoteReminder()"><i class="fas fa-bell"></i> Set Reminder</button>
      </div>
    </div>
    <div id="noteRemindersList"></div>

    <div id="monthView"></div>
  </section> -->

</html>
